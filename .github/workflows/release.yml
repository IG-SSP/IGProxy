name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test
        run: |
          bash -n bootstrap.sh install.sh install_gotelegram_bot.sh lib/*.sh
          python -m unittest discover -s tests -v
          python -m py_compile cluster/*.py gotelegram-bot/*.py admin-web/server.py
          node --check admin-web/static/app.js

      - name: Build portable installer
        run: |
          mkdir -p build
          python tools/build_portable_installer.py --output build/IGProxy
          (cd build && sha256sum -c IGProxy.sha256)

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            build/IGProxy \
            build/IGProxy.sha256 \
            --title "IGProxy ${GITHUB_REF_NAME}" \
            --generate-notes \
            --verify-tag
