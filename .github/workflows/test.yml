name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Bash syntax
        run: bash -n bootstrap.sh install.sh install_gotelegram_bot.sh lib/*.sh
      - name: Python tests
        run: python -m unittest discover -s tests -v
      - name: Python syntax
        run: python -m py_compile cluster/*.py gotelegram-bot/*.py admin-web/server.py
      - name: Browser JavaScript syntax
        run: node --check admin-web/static/app.js
      - name: Release manifest
        run: python tools/build_release.py --output /tmp/igproxy-release.tar.gz
