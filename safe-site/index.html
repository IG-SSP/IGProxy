<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Service Portal</title>
  <style>
    :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; background: #101722; color: #e8eef7; }
    main { width: min(38rem, calc(100% - 3rem)); padding: 2.5rem; border: 1px solid #33445c; border-radius: 1.25rem; background: #172233; box-shadow: 0 1.5rem 4rem #0006; }
    h1 { margin: 0 0 1rem; font-size: clamp(2rem, 7vw, 3.5rem); letter-spacing: -.04em; }
    p { margin: 0; color: #aebcd0; font-size: 1.05rem; line-height: 1.65; }
    .status { display: inline-flex; align-items: center; gap: .6rem; margin-top: 2rem; color: #92e6b2; font-weight: 650; }
    .status::before { content: ""; width: .7rem; height: .7rem; border-radius: 50%; background: #46d982; box-shadow: 0 0 1rem #46d98299; }
  </style>
</head>
<body>
  <main>
    <h1>Service Portal</h1>
    <p>This endpoint is online. Additional information will be published here when available.</p>
    <div class="status">Operational</div>
  </main>
</body>
</html>
