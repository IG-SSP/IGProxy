<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Сад за стеклом</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#082838;color:#f7fbf8}
    body{min-height:100svh;background:linear-gradient(90deg,rgba(3,28,40,.98) 0%,rgba(3,28,40,.83) 34%,rgba(3,28,40,.08) 72%),url("hero.webp") center/cover no-repeat;animation:gardenBreathe 12s ease-in-out infinite alternate}
    main{min-height:100svh;display:flex;align-items:center;padding:clamp(28px,6vw,100px)}
    article{max-width:610px}.mark{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#8ce6d1}
    h1{font-family:Georgia,serif;font-size:clamp(48px,7vw,94px);line-height:.94;margin:24px 0;letter-spacing:-.045em}
    p{max-width:540px;font-size:clamp(18px,2vw,23px);line-height:1.6;color:#d3e7e4}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}a,button{display:inline-flex;padding:18px 28px;border-radius:999px;font:inherit;font-weight:800;cursor:pointer;transition:.25s}a{background:#f6c779;color:#173443;text-decoration:none;box-shadow:0 16px 50px rgba(246,199,121,.22)}button{border:1px solid rgba(255,255,255,.18);background:rgba(5,31,41,.72);color:#f7fbf8}
    a:hover{transform:translateY(-3px);box-shadow:0 20px 60px rgba(246,199,121,.34)}
    small{display:block;margin-top:18px;color:#86aaa8}
    @keyframes gardenBreathe{to{background-position:center,56% center}}@media(max-width:700px){html,body{height:100%;overflow:hidden}body{background:linear-gradient(0deg,rgba(3,28,40,.99) 0%,rgba(3,28,40,.76) 58%,rgba(3,28,40,.18) 100%),url("hero.webp") 68% center/cover no-repeat}main{height:100svh;min-height:0;align-items:flex-end;padding:20px}article{max-height:100%}.mark{font-size:10px}h1{font-size:clamp(38px,12vw,52px);margin:14px 0}p{font-size:14px;line-height:1.42}.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.actions>*{width:100%;justify-content:center;padding:13px 10px;font-size:13px}small{margin-top:10px;font-size:11px}}@media(prefers-reduced-motion:reduce){body{animation:none}}
  </style>
</head>
<body>
  <main><article>
    <div class="mark">Небольшая басня о больших стенах</div>
    <h1>Сад за стеклом</h1>
    <p>Хранители внимательно считали закрытые двери. Бумажные птицы тем временем нашли калитку, которую никто не догадался запереть.</p>
    <div class="actions"><a id="connect" href="__PROXY_LINK__">Открыть калитку</a><button id="copy" type="button">Скопировать ссылку</button></div>
    <small id="status">Никаких форм, регистраций и лишних обещаний.</small>
  </article></main>
  <script>const a=document.getElementById("connect"),s=document.getElementById("status");document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(a.href)}catch(e){const t=document.createElement("textarea");t.value=a.href;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}s.textContent="Ссылка скопирована"};</script>
</body>
</html>
