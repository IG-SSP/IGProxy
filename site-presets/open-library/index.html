<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Библиотека открытых окон</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:#10051e;color:#fffaf1}
    body{min-height:100svh;background:linear-gradient(90deg,rgba(15,4,28,.99) 0%,rgba(15,4,28,.84) 35%,rgba(15,4,28,.04) 75%),url("hero.webp") center/cover no-repeat}
    main{min-height:100svh;display:flex;align-items:center;padding:clamp(28px,6vw,100px)}
    article{max-width:620px}.mark{letter-spacing:.16em;text-transform:uppercase;font-size:12px;color:#78d9ec}
    h1{font-family:Georgia,serif;font-size:clamp(46px,6.7vw,90px);line-height:.97;margin:24px 0;letter-spacing:-.04em}
    p{max-width:550px;font-size:clamp(18px,2vw,23px);line-height:1.6;color:#ddd2e9}
    .actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:30px}a,button{display:inline-flex;padding:18px 28px;border-radius:14px;font:inherit;font-weight:800;cursor:pointer;transition:.25s}a{background:#7fe3f0;color:#17102a;text-decoration:none;box-shadow:0 16px 50px rgba(79,203,229,.2)}button{border:1px solid rgba(255,255,255,.18);background:rgba(24,10,39,.72);color:#fffaf1}
    a:hover{transform:translateY(-3px) rotate(-.4deg);box-shadow:0 20px 60px rgba(79,203,229,.34)}
    small{display:block;margin-top:18px;color:#a99bb8}
    @media(max-width:700px){body{background:linear-gradient(0deg,rgba(15,4,28,.99) 0%,rgba(15,4,28,.78) 58%,rgba(15,4,28,.12) 100%),url("hero.webp") 72% center/cover no-repeat}main{align-items:flex-end}.actions{display:grid}.actions>*{width:100%;justify-content:center}h1{font-size:49px}}
  </style>
</head>
<body>
  <main><article>
    <div class="mark">История о правилах и окнах</div>
    <h1>Библиотека открытых окон</h1>
    <p>Совы исправно закрывали ставни по инструкции. Но книги давно научились складываться в лодки и читать море самостоятельно.</p>
    <div class="actions"><a id="connect" href="__PROXY_LINK__">Продолжить чтение</a><button id="copy" type="button">Скопировать ссылку</button></div>
    <small id="status">Большое окно всё ещё открыто.</small>
  </article></main>
  <script>const a=document.getElementById("connect"),s=document.getElementById("status");document.getElementById("copy").onclick=async()=>{try{await navigator.clipboard.writeText(a.href)}catch(e){const t=document.createElement("textarea");t.value=a.href;document.body.appendChild(t);t.select();document.execCommand("copy");t.remove()}s.textContent="Ссылка скопирована"};</script>
</body>
</html>
