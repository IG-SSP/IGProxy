  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}button,a{font:inherit}body{--a:#75d5ff;--b:#a78bfa;--bg:#07101d;--ink:#f8fafc;--muted:#aab7c8;--panel:rgba(13,23,39,.8);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
    .backdrop{position:fixed;inset:0;z-index:-2;overflow:hidden}.backdrop::before,.backdrop::after{content:"";position:absolute;border-radius:50%;filter:blur(3px);opacity:.55}.backdrop::before{width:55vw;height:55vw;left:-18vw;top:-22vw;background:radial-gradient(circle,var(--a),transparent 68%)}.backdrop::after{width:48vw;height:48vw;right:-16vw;bottom:-20vw;background:radial-gradient(circle,var(--b),transparent 68%)}
    .shell{width:min(1180px,calc(100% - 32px));min-height:100vh;margin:auto;display:grid;grid-template-columns:minmax(0,1.05fr) minmax(320px,.95fr);align-items:center;gap:clamp(30px,6vw,88px);padding:50px 0}.copy{max-width:660px}.badge{display:inline-flex;align-items:center;gap:9px;padding:8px 12px;border:1px solid rgba(255,255,255,.16);border-radius:999px;background:rgba(6,13,24,.48);backdrop-filter:blur(12px);font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.badge i{width:8px;height:8px;border-radius:50%;background:var(--a);box-shadow:0 0 16px var(--a)}
    h1{margin:22px 0 16px;font-size:clamp(46px,7vw,86px);line-height:.98;letter-spacing:-.055em;text-wrap:balance}.lead{max-width:610px;margin:0;color:var(--muted);font-size:clamp(17px,2vw,21px);line-height:1.58}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:30px}.primary,.secondary{min-height:56px;border:0;border-radius:15px;padding:0 21px;font-weight:850;cursor:pointer;transition:transform .18s ease,filter .18s ease}.primary{display:inline-flex;align-items:center;gap:10px;color:#07101d;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 16px 42px color-mix(in srgb,var(--a) 23%,transparent);text-decoration:none}.secondary{color:var(--ink);border:1px solid rgba(255,255,255,.16);background:rgba(8,16,28,.68)}.primary:hover,.secondary:hover{transform:translateY(-2px);filter:brightness(1.08)}.copied{width:100%;min-height:20px;color:var(--a);font-size:13px;font-weight:750}
    .scene{position:relative;min-height:560px;display:grid;place-items:center}.artifact{position:relative;width:min(455px,100%);aspect-ratio:.84;border:1px solid rgba(255,255,255,.16);border-radius:34px;background:linear-gradient(145deg,rgba(255,255,255,.13),rgba(8,16,29,.82));box-shadow:0 40px 100px rgba(0,0,0,.42);overflow:hidden;transform:rotate(1.5deg)}.grid{position:absolute;inset:0;opacity:.32;background-image:linear-gradient(rgba(255,255,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.08) 1px,transparent 1px);background-size:38px 38px}.orb{position:absolute;inset:13%;border:1px solid color-mix(in srgb,var(--a) 55%,transparent);border-radius:50%}.orb::after{content:"";position:absolute;inset:18%;border:1px solid color-mix(in srgb,var(--b) 60%,transparent);border-radius:inherit}.symbol{position:absolute;left:50%;top:14%;transform:translateX(-50%);font-size:78px;filter:drop-shadow(0 18px 24px rgba(0,0,0,.3))}.console{position:absolute;inset:38% 14% 17%;display:grid;align-content:center;gap:13px;border:1px solid rgba(255,255,255,.12);border-radius:24px;background:rgba(5,12,22,.76);padding:24px}.lights{display:flex;gap:6px}.lights i{width:9px;height:9px;border-radius:50%;background:var(--a)}.lights i:nth-child(2){background:var(--b)}.lights i:nth-child(3){background:#34d399}.line{height:8px;border-radius:99px;background:linear-gradient(90deg,var(--a),var(--b))}.line:nth-child(3){width:72%;opacity:.63}.line:nth-child(4){width:48%;opacity:.34}.caption{position:absolute;left:22px;right:22px;bottom:20px;display:flex;justify-content:space-between;gap:12px;font-size:11px;font-weight:850;letter-spacing:.08em;text-transform:uppercase}.tag{position:absolute;z-index:3;display:inline-flex;align-items:center;gap:8px;max-width:190px;padding:9px 13px;border:1px solid rgba(255,255,255,.17);border-radius:999px;background:rgba(7,15,28,.88);backdrop-filter:blur(14px);font-size:11px;font-weight:850;box-shadow:0 14px 38px rgba(0,0,0,.28)}.tag::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--a);box-shadow:0 0 14px var(--a)}.tag-a{left:12px;top:13%}.tag-b{right:12px;bottom:14%}.tag-b::before{background:var(--b);box-shadow:0 0 14px var(--b)}

    /* 01 — newspaper front page */

    /* 04 — terminal */
    .layout-terminal{--bg:#02120c;--ink:#baffd8;--muted:#72b58e;--a:#39ff88;--b:#00c96b}.layout-terminal{font-family:ui-monospace,SFMono-Regular,Consolas,monospace}.layout-terminal .backdrop{background:repeating-linear-gradient(0deg,transparent 0 3px,rgba(57,255,136,.025) 4px)}.layout-terminal .artifact{aspect-ratio:1.15;border:1px solid #39ff88;border-radius:8px;background:#041a11;box-shadow:0 0 70px rgba(57,255,136,.13);transform:none}.layout-terminal .grid{background-size:22px 22px;opacity:.2}.layout-terminal .orb{inset:8% 8% 72%;border:0;border-bottom:1px solid #39ff88;border-radius:0}.layout-terminal .orb::after{content:"●  ●  ●     ROUTE.SYS / ONLINE";inset:0;display:flex;align-items:center;border:0;color:#39ff88;font-size:12px}.layout-terminal .symbol{top:23%;font-size:84px}.layout-terminal .console{inset:56% 8% 10%;border-radius:2px;border-color:#39ff88;background:#02120c}.layout-terminal .line{height:2px;background:#39ff88}.layout-terminal .line::before{content:"> routing package";color:#39ff88;font-size:11px;position:relative;top:-15px}.layout-terminal h1{letter-spacing:-.045em}.layout-terminal .primary{border:1px solid #39ff88;border-radius:3px;background:#39ff88;box-shadow:0 0 35px rgba(57,255,136,.2)}.layout-terminal .secondary,.layout-terminal .tag{border-color:#39ff88;border-radius:3px;background:#03160e;color:#baffd8}
    /* 05 — botanical atlas */

    /* 07 — old tea menu */
    .layout-tearoom{--bg:#3a1717;--ink:#f7e6c4;--muted:#c9ae87;--a:#e4b65f;--b:#8ebc8b}.layout-tearoom .backdrop{background:radial-gradient(circle at center,rgba(228,182,95,.12),transparent 45%),repeating-linear-gradient(90deg,rgba(255,255,255,.02) 0 1px,transparent 1px 18px)}.layout-tearoom .copy{border:1px solid #e4b65f;padding:28px}.layout-tearoom h1{font-family:Georgia,serif;font-weight:500}.layout-tearoom .artifact{aspect-ratio:.76;border:4px double #e4b65f;border-radius:180px 180px 18px 18px;background:#4b2020;box-shadow:0 36px 80px rgba(0,0,0,.35);transform:none}.layout-tearoom .grid{display:none}.layout-tearoom .orb{inset:8% 12% 52%;border:1px solid #e4b65f;border-radius:50%}.layout-tearoom .symbol{top:19%;font-size:94px}.layout-tearoom .console{inset:53% 12% 12%;border:1px solid #e4b65f;border-radius:4px;background:#321313}.layout-tearoom .line{height:1px;background:#e4b65f}.layout-tearoom .primary{border-radius:2px;background:#e4b65f;box-shadow:none}.layout-tearoom .secondary,.layout-tearoom .tag{border-color:#e4b65f;border-radius:2px;background:#321313;color:#f7e6c4}.layout-tearoom .caption{color:#f7e6c4}
    /* 08 — maritime signal */
    .layout-beacon{--bg:#071d2d;--ink:#f8f2df;--muted:#9db2bc;--a:#ff6933;--b:#47b8c8}.layout-beacon .backdrop{background:linear-gradient(165deg,transparent 55%,rgba(71,184,200,.18) 56% 58%,transparent 59%)}.layout-beacon .shell{grid-template-columns:1.12fr .88fr}.layout-beacon h1{text-transform:uppercase;font-weight:950}.layout-beacon .artifact{aspect-ratio:.8;border:0;border-radius:240px 240px 20px 20px;background:#f8f2df;box-shadow:20px 20px 0 #ff6933;transform:none}.layout-beacon .grid{background-size:100% 70px;opacity:.18}.layout-beacon .orb{inset:10% 15% 45%;border:18px solid #071d2d;border-radius:50%}.layout-beacon .orb::after{inset:28%;border:0;background:#ff6933}.layout-beacon .symbol{top:34%;font-size:88px}.layout-beacon .console{inset:64% 12% 9%;border:0;border-radius:2px;background:#071d2d}.layout-beacon .line{height:4px;background:#47b8c8}.layout-beacon .primary{background:#ff6933;color:#071d2d;box-shadow:none}.layout-beacon .secondary{border-color:#f8f2df}.layout-beacon .caption{color:#071d2d}.layout-beacon .tag{border:0;border-radius:2px;background:#ff6933;color:#071d2d;box-shadow:none}

<body>
  <div class="backdrop"></div>
  <main class="shell">
    <section class="copy">
      <span class="badge"><i></i><span id="badge"></span></span>
      <h1 id="title"></h1>
      <p class="lead" id="text"></p>
      <div class="actions">
        <a class="primary" id="connect" href="__PROXY_LINK__"><span id="action"></span><span>↗</span></a>
        <button class="secondary" id="copy" type="button">Скопировать ссылку</button>
        <span class="copied" id="copied" role="status"></span>
      </div>
    </section>
    <section class="scene" aria-hidden="true">
      <div class="artifact"><div class="grid"></div><div class="orb"></div><div class="symbol" id="symbol"></div><div class="console"><div class="lights"><i></i><i></i><i></i></div><div class="line"></div><div class="line"></div><div class="line"></div></div><div class="caption"><span id="left"></span><span id="right"></span></div></div>
      <span class="tag tag-a" id="tagA"></span><span class="tag tag-b" id="tagB"></span>
    </section>
  </main>
  <script>
    const stories=[
      ["editorial","Ночная редакция","Книги снова умеют плавать","Когда мост подняли, страницы сложились лодками и нашли другой берег.","Спустить лодку","🦉","тираж готов","берег виден","тихий причал","окно редакции"],
