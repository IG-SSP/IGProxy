  <style>
    *{box-sizing:border-box}html,body{min-height:100%;margin:0}button,a{font:inherit}body{--a:#75d5ff;--b:#a78bfa;--bg:#07101d;--ink:#f8fafc;--muted:#aab7c8;--panel:rgba(13,23,39,.8);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg);overflow-x:hidden}
